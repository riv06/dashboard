<!-- Super Admins Section - Add this to super-admin-dashboard.html after overview section -->

<!-- SUPER ADMINS SECTION -->
<section id="section-super-admins" class="dashboard-section hidden">
    <div class="card">
        <div class="card-header">
            <h2 class="card-title">Gestión de Super Administradores</h2>
            <button class="btn btn-danger" onclick="openSuperAdminModal()">+ Nuevo Super Admin</button>
        </div>
        <div class="card-body">
            <div class="table-container">
                <table class="table">
                    <thead class="red">
                        <tr>
                            <th>ID</th>
                            <th>Usuario</th>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="super-admins-table-body">
                        <tr>
                            <td colspan="5" class="text-center">Cargando...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>

<!-- Super Admin Modal - Add this before closing body tag -->
<div id="super-admin-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="modal-title" id="super-admin-modal-title">Nuevo Super Admin</h2>
            <span class="modal-close" onclick="closeSuperAdminModal()">&times;</span>
        </div>
        <div class="modal-body">
            <form id="super-admin-form">
                <input type="hidden" id="super-admin-id">
                <div class="form-group">
                    <label class="form-label">Usuario *</label>
                    <input type="text" id="super-admin-username" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Contraseña *</label>
                    <input type="password" id="super-admin-password" class="form-input">
                    <small>Dejar en blanco para mantener la contraseña actual al editar</small>
                </div>
                <div class="form-group">
                    <label class="form-label">Nombre Completo</label>
                    <input type="text" id="super-admin-name" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="super-admin-email" class="form-input">
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeSuperAdminModal()">Cancelar</button>
            <button class="btn btn-success" onclick="saveSuperAdmin()">Guardar</button>
        </div>
    </div>
</div>
